site_name: Gripora Documentation
site_description: Documentation for Gripora, open-source stability-control firmware for RC cars, and its configurator
site_url: https://doc.gripora.org/
repo_url: https://github.com/gripora-project
repo_name: Gripora
edit_uri: https://github.com/gripora-project/gripora-docs/edit/main/docs/

theme:
  name: material
  logo: assets/gripora_icon_white.svg # white variant of the Gripora icon, for contrast against the coloured toolbar
  favicon: assets/favicon.ico
  font: false # use the system-font stack from color-palette.html instead of a fetched webfont
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.code.copy

plugins:
  - search

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/gripora-project

